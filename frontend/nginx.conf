server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # SPA: redirigir todas las rutas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para archivos estáticos con hash (CRA los genera con hash en el nombre)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cachear index.html para que siempre sirva la version mas reciente
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
